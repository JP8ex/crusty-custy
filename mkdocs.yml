site_name: The Great Crusty Custy Cookbook
site_url: 

theme:
  name: material

  language: en

  palette: 
  
  # Light mode
  - scheme: default
    toggle:
      icon: material/ski
      name: Swith to dark mode
    primary: blue grey
    accent: light blue

  # Dark mode
  - scheme: slate
    toggle:
      icon: material/snowboard
      name: Switch to light mode
    primary: blue grey
    accent: light blue

  font:
    text: Play
    code: Roboto Mono
  
  logo: path/to/file.png #located in docs need to set
  
  favicon: images/favicon.png #located in docs need to set

  icon:
    previous: material/arrow-u-left-top
    next: material/arrow-u-right-bottom

extra: 
  homepage: https://www.youtube.com/watch?v=HIcSWuKMwOw 
  consent:
    title: Cookie consent
    description: We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    actions:
      - accept
      - reject
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JP8ex/crusty-custy

  features:
    - search.share
    - search.highlight
    - search.suggest
    - header.autohide
    - navigation.footer


plugins:
  - search:
      
